apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expense-tracker    
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: oghenetejiri798/expense-tracker-frontend:26485727648
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: ""              
          resources:                
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"